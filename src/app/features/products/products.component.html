<section class="feature">
  <h2>Products</h2>
  <div class="toolbar">
    <button type="button" (click)="load()">Load Products</button>
    <a href="/counter">Counter</a>
  </div>
  @if (loading()) { <p>Loading...</p> }
  <ul class="list">
    @for (p of products(); track p.id) {
      <li [class.selected]="p.id === selectedId()">
        <button type="button" (click)="select(p.id)">#{{ p.id }} - {{ p.name }} (${{ p.price }})</button>
      </li>
    }
  </ul>
  @if (selected()) {
    <article class="detail">
      <h3>Selected</h3>
      <p><strong>Name:</strong> {{ selected()!.name }}</p>
      <p><strong>Category:</strong> {{ selected()!.category }}</p>
      <p><strong>Price:</strong> ${{ selected()!.price }}</p>
      <p><strong>Stock:</strong> {{ selected()!.stock }}</p>
    </article>
  } @else { <p>No product selected.</p> }
</section>
